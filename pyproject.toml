[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-agent-system"
version = "0.5.0"
description = "Brain simulation agent system with 2047 nodes organized in a full binary tree topology"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "BrainAgent Team"}]
keywords = ["brain", "simulation", "neural", "agent", "binary-tree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
]

[project.scripts]
brain-agent = "brain_agent.main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "flake8",
]
progress = [
    "tqdm",
]
dataframe = [
    "pandas",
]
all = [
    "tqdm",
    "pandas",
    "pytest",
    "pytest-asyncio",
    "mypy",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["src"]

# === pytest ===
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# === mypy ===
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

# === flake8 ===
[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
    "src/brain_agent/generated/",
]

# === black ===
[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
exclude = 'src/brain_agent/generated/'

# === isort ===
[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["src/brain_agent/generated/*"]
